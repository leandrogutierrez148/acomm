[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acomm-frontend"
version = "0.1.0"
description = "Streamlit UI for Acomm purchasing agent"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.38.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "streamlit-carousel-uui>=0.1.4"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[browser]
gatherUsageStats = false